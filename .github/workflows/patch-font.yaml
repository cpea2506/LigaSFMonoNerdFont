name: Patch Font

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'
  push:
    tags:
    - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      update: ${{ steps.version.outputs.update }}

    steps:
      # Re-enabling resets GitHub's 60-day inactivity timer for scheduled workflows
      - name: Keep Workflow Alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow enable patch-font.yaml --repo "${{ github.repository }}"

      - name: Check Nerd Fonts Release
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release view --repo ryanoasis/nerd-fonts --json tagName -q .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Scheduled runs only patch when this repo has no release for the latest Nerd Fonts tag yet
          if [ "${{ github.event_name }}" = schedule ] && gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

  patch-font:
    needs: check
    if: needs.check.outputs.update == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FontForge
        run: |
          brew update
          brew install fontforge

      - name: Download and Extract FontPatcher
        run: |
          curl -Lo FontPatcher.zip https://github.com/ryanoasis/nerd-fonts/releases/download/${{ needs.check.outputs.tag }}/FontPatcher.zip
          unzip FontPatcher.zip -d Fontpatcher
          chmod +x Fontpatcher/font-patcher

      - name: Run Font Patch Script
        run: |
          for file in *.otf; do
              echo "$file"

              fontforge -script ./FontPatcher/font-patcher -c "$file" -out ./Output
          done

      - name: Zip Patched Fonts
        run: |
          zip -jr LigaSFMonoNerdFont.zip ./Output/*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LigaSFMonoNerdFont
          path: LigaSFMonoNerdFont.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || needs.check.outputs.tag }}
          files: LigaSFMonoNerdFont.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
